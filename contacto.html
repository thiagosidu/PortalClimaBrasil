    <div class="container my-4">
        <h2>Formulário de Contato</h2>
        <form action="#" method="post" class="mt-4" style="max-width: 600px;">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo:</label>
                <input type="text" id="nome" name="nome" class="form-control form-control-custom" placeholder="Digite o seu nome" required minlength="3">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" id="email" name="email" class="form-control form-control-custom" placeholder="exemplo@email.com" required>
            </div>

            <div class="mb-3">
                <label for="assunto" class="form-label">Assunto:</label>
                <select id="assunto" name="assunto" class="form-select form-control-custom" required>
                    <option value="">Selecione um assunto</option>
                    <option value="duvida">Dúvida sobre o clima</option>
                    <option value="sugestao">Sugestão</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" class="form-control form-control-custom" rows="4" placeholder="Escreva a mensagem..." required minlength="10"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar Mensagem</button>
            <p id="msgContatoSucesso" style="margin-top: 15px; font-weight: bold;"></p>
        </form>
    </div>
